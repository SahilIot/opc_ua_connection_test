<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PLC Monitoring Dashboard</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, Segoe UI, sans-serif; }
    body { margin: 0; padding: 24px; background: Canvas; color: CanvasText; }
    main { max-width: 1100px; margin: auto; }
    header { display: flex; gap: 16px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
    .muted { opacity: .7; }
    .status { padding: 8px 12px; border: 1px solid GrayText; border-radius: 999px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-top: 22px; }
    .card { border: 1px solid GrayText; border-radius: 14px; padding: 16px; overflow-wrap: anywhere; }
    .node { font-size: .85rem; opacity: .75; }
    .value { font-size: 1.8rem; font-weight: 650; margin: 12px 0; }
    .meta { font-size: .85rem; line-height: 1.6; opacity: .8; }
    button { padding: 9px 14px; cursor: pointer; border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; margin-top: 24px; }
    th, td { padding: 9px; border-bottom: 1px solid GrayText; text-align: left; overflow-wrap: anywhere; }
    @media (max-width: 600px) { body { padding: 14px; } table { font-size: .8rem; } }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>PLC Monitoring</h1>
      <div class="muted">Latest values received and stored by the backend</div>
    </div>
    <div>
      <span id="status" class="status">Connecting…</span>
      <button id="refresh">Refresh</button>
    </div>
  </header>
  <p id="updated" class="muted">Waiting for first refresh…</p>
  <section id="cards" class="grid"></section>
  <h2>Latest readings</h2>
  <div style="overflow-x:auto">
    <table>
      <thead><tr><th>NodeId</th><th>Value</th><th>Type</th><th>Quality</th><th>Source time</th><th>Received</th></tr></thead>
      <tbody id="rows"><tr><td colspan="6">Loading…</td></tr></tbody>
    </table>
  </div>
</main>
<script>
  const statusEl = document.getElementById("status");
  const cardsEl = document.getElementById("cards");
  const rowsEl = document.getElementById("rows");
  const updatedEl = document.getElementById("updated");
  const safe = (value) => value === null || value === undefined ? "—" :
    (typeof value === "object" ? JSON.stringify(value) : String(value));
  const date = (value) => value ? new Date(value).toLocaleString() : "—";
  async function refresh() {
    try {
      const response = await fetch("/readings/latest?limit=100", { cache: "no-store" });
      if (!response.ok) throw new Error("API returned HTTP " + response.status);
      const readings = await response.json();
      statusEl.textContent = "API connected";
      updatedEl.textContent = "Last refreshed: " + new Date().toLocaleTimeString() +
        " · " + readings.length + " stored reading(s)";
      const newestByNode = new Map();
      for (const item of readings) if (!newestByNode.has(item.node_id)) newestByNode.set(item.node_id, item);
      cardsEl.replaceChildren();
      for (const item of newestByNode.values()) {
        const card = document.createElement("article");
        card.className = "card";
        const node = document.createElement("div"); node.className = "node"; node.textContent = item.node_id;
        const value = document.createElement("div"); value.className = "value"; value.textContent = safe(item.value);
        const meta = document.createElement("div"); meta.className = "meta";
        meta.textContent = "Quality: " + item.status_code + " · Received: " + date(item.received_at);
        card.append(node, value, meta); cardsEl.append(card);
      }
      rowsEl.replaceChildren();
      if (!readings.length) {
        const tr = document.createElement("tr"), td = document.createElement("td");
        td.colSpan = 6; td.textContent = "No readings stored yet. Configure OPC UA NodeIds and confirm the collector is connected.";
        tr.append(td); rowsEl.append(tr);
      } else {
        for (const item of readings) {
          const tr = document.createElement("tr");
          for (const value of [item.node_id, safe(item.value), item.value_type, item.status_code, date(item.source_timestamp), date(item.received_at)]) {
            const td = document.createElement("td"); td.textContent = value; tr.append(td);
          }
          rowsEl.append(tr);
        }
      }
    } catch (error) {
      statusEl.textContent = "API unavailable";
      updatedEl.textContent = error.message;
    }
  }
  document.getElementById("refresh").addEventListener("click", refresh);
  refresh();
  setInterval(refresh, 3000);
</script>
</body>
</html>
